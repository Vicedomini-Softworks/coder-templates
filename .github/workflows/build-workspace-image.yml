name: Build and push workspace image

on:
  push:
    branches: [main]
    paths:
      - "railway/**"
      - ".github/workflows/build-workspace-image.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: vicedominisoftworks/railway-vicedominidev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: railway/build
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-coder:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      CODER_URL: https://${{ vars.CODER_DOMAIN || secrets.CODER_DOMAIN }}
      CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to match coder.vicedomini.dev's actual server version: the
      # Coder CLI refuses to talk to an older server than itself, and
      # `/api/v2/buildinfo` (which would otherwise let this resolve itself
      # automatically) sits behind Cloudflare and 403s GitHub Actions
      # runners' IPs specifically, so a dynamic lookup isn't reliable here.
      # Bump this when the server is upgraded.
      - name: Install Coder CLI (matching the server version)
        run: curl -fsSL https://coder.com/install.sh | sh -s -- --version 2.35.2

      - name: Push new template version
        working-directory: railway
        run: |
          coder templates push railway \
            --directory . \
            --variable "railway_token=${{ secrets.RAILWAY_TOKEN }}" \
            --variable "workspace_image=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --message "CI: image ${{ github.sha }}" \
            --yes

      # Deliberately no auto-update/restart of running workspaces here:
      # each workspace owner decides when to pick up the new template
      # version (`coder update <workspace>`, or their own auto-update
      # policy), since a restart interrupts whatever they're doing.
